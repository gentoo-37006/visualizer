name: Publish viewer package

on:
  push:
    tags:
      - 'viewer-v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - run: npm ci
      - run: npm test
      - run: npm run build:tracker

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gradle -p viewer-package
          publishViewerPublicationToGitHubPackagesRepository
          -PviewerPackageVersion="${GITHUB_REF_NAME#viewer-v}"
